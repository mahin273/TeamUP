name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Native Project
        working-directory: ./client
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: ./client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          echo "Listing all built APK files:"
          find client/android/app/build/outputs/apk/ -type f -name "*.apk"
          APK_PATH=$(find client/android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" release-assets/TeamUp.apk
          ls -lh release-assets/

      - name: Set Release Metadata
        id: meta
        run: |
          TAG_NAME="v1.0.0-build.${{ github.run_number }}"
          RELEASE_TITLE="TeamUp Android APK v1.0.0 (Build #${{ github.run_number }})"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ## 🚀 TeamUp Android App — Build #${{ github.run_number }}

            Automated Android APK build compiled from commit `${{ github.sha }}`.

            ### 📱 Download & Install Instructions:
            1. Download **`TeamUp.apk`** below directly to your Android device.
            2. Open the file to install the TeamUp application.
            3. Launch the app and test the university project collaboration features!

            ---
            - **Commit:** `${{ github.sha }}`
            - **Triggered By:** @${{ github.actor }}
            - **Branch:** `${{ github.ref_name }}`
            - **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          files: release-assets/TeamUp.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
