name: test
on: [pull_request, push]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: teamup_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/teamup_test?schema=public
      JWT_SECRET: ci-access
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      UPLOAD_DIR: ./tmp/test-uploads
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint --if-present
      - run: npm test -- --coverage
      - run: npx jest --config ./test/jest-e2e.json --runInBand
